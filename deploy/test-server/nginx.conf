# JiraniChama test server. __HOST__ and __PORT__ are filled in by setup.sh; certbot adds
# the HTTPS part.
server {
    listen 80;
    server_name __HOST__;
    client_max_body_size 12m;

    # Compress API answers: the records list is ~150 KB of JSON and shrinks to a fifth.
    # Less mobile data, faster screens and less radio time on members' phones.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types application/json application/problem+json text/plain text/css
               application/javascript image/svg+xml;

    location /static/ {
        alias /home/deploy/sites/jiranichama/staticfiles/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
