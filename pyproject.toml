[project]
name = "jiranichama-api"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
# DJ001: ledger text fields are nullable on purpose; the hashed document must tell
# "no value" (null) apart from an empty string.
ignore = ["DJ008", "DJ001"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["apps", "tests"]
addopts = "-q --reuse-db"
