# Local development stack. Ports are offset (5440, 6390, 6440) so they do not clash with
# other projects on the same machine. Stop it when you are done: docker compose down
name: jiranichama
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jiranichama
      POSTGRES_USER: jiranichama
      POSTGRES_PASSWORD: jiranichama
    ports: ["5440:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiranichama"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7
    ports: ["6390:6379"]

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    environment:
      DATABASE_URL: postgres://jiranichama:jiranichama@db:5432/jiranichama
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
    ports: ["6440:5432"]
    depends_on:
      db: {condition: service_healthy}
    profiles: ["full"]

volumes:
  pgdata:
